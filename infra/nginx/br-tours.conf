upstream br_web {
  server 127.0.0.1:3000;
}

upstream br_api {
  server 127.0.0.1:4000;
}

server {
  listen 80;
  listen [::]:80;
  server_name br.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name br.example.com;

  ssl_certificate /etc/letsencrypt/live/br.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/br.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;

  client_max_body_size 12m;

  location = /admin {
    return 308 /admin/;
  }

  location ^~ /admin/ {
    alias /srv/br-tours/tours_and_travels_adminpanel/dist/;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
  }

  location ^~ /api/v1/ {
    proxy_pass http://br_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
  }

  location ^~ /media/ {
    proxy_pass http://br_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://br_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
