name: br-tours-local-services

services:
  mysql:
    image: mysql:8.4.11
    env_file:
      - ../.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - br_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.30.6
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGE_SIZE: "10"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - br_mailpit_data:/data
    restart: unless-stopped

volumes:
  br_mysql_data:
  br_mailpit_data:
