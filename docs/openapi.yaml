components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: br_admin_session
      description: Environment-configured opaque session cookie; never a browser-storage token.
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, maxLength: 30 }
    Slug:
      in: path
      name: slug
      required: true
      schema: { type: string, maxLength: 180 }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
    CsrfToken:
      in: header
      name: x-csrf-token
      required: true
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: idempotency-key
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  schemas:
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 256 }
    InquiryInput:
      type: object
      additionalProperties: false
      required: [type, name, email, message, privacyAccepted, policyVersion]
      properties:
        type:
          { type: string, enum: [CONTACT, PACKAGE_ENQUIRY, BOOKING_REQUEST] }
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 40 }
        subject: { type: string, maxLength: 200 }
        message: { type: string, minLength: 10, maxLength: 5000 }
        packageSlug: { type: string, maxLength: 180 }
        departureId: { type: string, maxLength: 30 }
        preferredStartDate: { type: string, format: date }
        adultCount: { type: integer, minimum: 1, maximum: 50 }
        childCount: { type: integer, minimum: 0, maximum: 50 }
        budget: { type: number, minimum: 0 }
        sourcePath: { type: string, maxLength: 500 }
        privacyAccepted: { type: boolean, const: true }
        policyVersion: { type: string, maxLength: 64 }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              {
                type: object,
                additionalProperties: { type: array, items: { type: string } },
              }
            requestId: { type: string }
  responses:
    Error:
      description: Safe API error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
